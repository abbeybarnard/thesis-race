name: Collect automatic counts
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: race-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_auto.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "thesis-race-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Collect automatic counts"
            git pull --rebase --quiet && git push
            gh workflow run pages.yml
          fi
